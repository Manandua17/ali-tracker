<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliExpress Cashback Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f5f5f5; color: #333; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .current-rate { font-size: 3.5rem; font-weight: bold; color: #27ae60; text-align: center; margin: 10px 0; }
        .date-label { text-align: center; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 20px; }
        .filter-container { text-align: right; margin-bottom: 10px; }
        select, input[type="date"] { padding: 8px 12px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; cursor: pointer; font-family: inherit; }
        #customDateContainer { display: none; text-align: right; margin-bottom: 15px; margin-top: 10px; }
        button { padding: 9px 15px; border-radius: 5px; border: none; background-color: #2980b9; color: white; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #1c5980; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-weight: 600; }
        tr:hover { background-color: #f1f2f6; }
    </style>
</head>
<body>

    <h1>AliExpress Cashback Tracker</h1>
    
    <div class="card">
        <h2 style="text-align: center; margin-top: 0;">Current Rakuten Rate</h2>
        <div class="current-rate" id="latestRate">--%</div>
        <div class="date-label" id="latestDate">Awaiting first run...</div>
    </div>

    <div class="filter-container">
        <label for="timeRange"><strong>Time Range: </strong></label>
        <select id="timeRange">
            <option value="all">All Time</option>
            <option value="30">Last 30 Days</option>
            <option value="90">Last 3 Months</option>
            <option value="180">Last 6 Months</option>
            <option value="365">Last 1 Year</option>
            <option value="custom">Custom Range...</option>
        </select>
    </div>

    <div id="customDateContainer">
        <input type="date" id="startDate">
        <span> to </span>
        <input type="date" id="endDate">
        <button id="applyCustomDate">Apply</button>
    </div>

    <div class="card">
        <canvas id="cashbackChart"></canvas>
    </div>

    <div class="card">
        <h3>History Log</h3>
        <table>
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Cashback Rate (%)</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
            </tbody>
        </table>
    </div>

    <script>
        let allData = [];
        let cashbackChart = null;

        document.getElementById('timeRange').addEventListener('change', function() {
            const customContainer = document.getElementById('customDateContainer');
            if (this.value === 'custom') {
                customContainer.style.display = 'block';
            } else {
                customContainer.style.display = 'none';
                updateDashboard(this.value);
            }
        });

        document.getElementById('applyCustomDate').addEventListener('click', function() {
            updateDashboard('custom');
        });

        fetch('cashback_history.csv?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error("CSV not found yet");
                return response.text();
            })
            .then(data => {
                const rows = data.trim().split('\n');
                rows.shift(); 
                
                rows.forEach(row => {
                    const [date, rate] = row.split(',');
                    if(date && rate) {
                        // Create valid date format for parsing (replacing space with T if needed)
                        const isoDateStr = date.replace(' ', 'T');
                        allData.push({
                            dateStr: date,
                            timestamp: new Date(isoDateStr).getTime(),
                            rate: parseFloat(rate)
                        });
                    }
                });

                if (allData.length > 0) {
                    const latest = allData[allData.length - 1];
                    document.getElementById('latestRate').innerText = latest.rate + '%';
                    document.getElementById('latestDate').innerText = 'Last updated: ' + latest.dateStr;
                }

                const ctx = document.getElementById('cashbackChart').getContext('2d');
                cashbackChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Cashback Rate (%)',
                            data: [],
                            borderColor: '#2980b9',
                            backgroundColor: 'rgba(41, 128, 185, 0.2)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.2
                        }]
                    },
                    options: { responsive: true, scales: { y: { beginAtZero: true } } }
                });

                updateDashboard('all');
            })
            .catch(error => { console.log('Waiting for first action run to generate CSV.'); });

        function updateDashboard(days) {
            const now = new Date().getTime();
            let startCutoff = 0;
            let endCutoff = Number.MAX_SAFE_INTEGER;

            if (days === 'custom') {
                const startVal = document.getElementById('startDate').value;
                const endVal = document.getElementById('endDate').value;
                
                if (startVal) {
                    // Append local time start of day
                    startCutoff = new Date(startVal + 'T00:00:00').getTime();
                }
                if (endVal) {
                    // Append local time end of day
                    endCutoff = new Date(endVal + 'T23:59:59').getTime();
                }
            } else if (days !== 'all') {
                const daysInMs = parseInt(days) * 24 * 60 * 60 * 1000;
                startCutoff = now - daysInMs;
            }

            const filteredData = allData.filter(item => item.timestamp >= startCutoff && item.timestamp <= endCutoff);

            const dates = filteredData.map(item => item.dateStr);
            const rates = filteredData.map(item => item.rate);

            if (cashbackChart) {
                cashbackChart.data.labels = dates;
                cashbackChart.data.datasets[0].data = rates;
                cashbackChart.update();
            }

            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = ''; 

            for (let i = filteredData.length - 1; i >= 0; i--) {
                const item = filteredData[i];
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${item.dateStr}</td><td>${item.rate}%</td>`;
                tableBody.appendChild(tr);
            }
        }
    </script>
</body>
</html>
